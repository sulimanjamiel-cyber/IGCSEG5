<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maaz's Science Quest</title>
<meta name="description" content="Interactive science games for Maaz – Cambridge Primary Science, Stage 5.">
<meta property="og:title" content="Maaz's Science Quest 🔬">
<meta property="og:description" content="Interactive science games for Maaz – Cambridge Primary Science, Stage 5. Unit 1: Life cycles of flowering plants.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Maaz's Science Quest 🔬">
<meta name="twitter:description" content="Interactive science games – Cambridge Primary Science, Stage 5.">
<meta name="theme-color" content="#7b2ff7">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Cairo:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b2350; --muted:#6b6490; --card:#ffffff; --bg1:#ffe9f3; --bg2:#e6f4ff;
  --purple:#7b2ff7; --pink:#ff4d8d; --orange:#ff9f1c; --green:#2ec4b6; --good:#22b35e; --bad:#ef476f;
  --yellow:#ffd23f; --blue:#3a86ff; --shadow:0 6px 0 rgba(43,35,80,.12), 0 10px 24px rgba(43,35,80,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);min-height:100vh;
  background:linear-gradient(160deg,var(--bg1) 0%,#fff6e0 45%,var(--bg2) 100%) fixed;}
#app{max-width:780px;margin:0 auto;padding:16px 16px 60px}
button{font-family:inherit;cursor:pointer}
h1,h2,h3{margin:0;line-height:1.15}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{border:0;background:#fff;border-radius:14px;padding:8px 14px;font-size:18px;font-weight:700;color:var(--purple);box-shadow:var(--shadow)}
.bar .t{flex:1;font-size:20px;font-weight:800}
.starsum{background:#fff;border-radius:14px;padding:6px 12px;font-weight:800;box-shadow:var(--shadow);white-space:nowrap}

/* home */
.hero{text-align:center;padding:18px 10px 8px}
.hero .logo{font-size:64px;line-height:1;animation:bob 3s ease-in-out infinite}
.hero h1{font-size:40px;font-weight:800;background:linear-gradient(90deg,var(--purple),var(--pink),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:4px 0 0;color:var(--muted);font-size:18px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:16px}
.tile{position:relative;border:0;text-align:left;border-radius:22px;padding:16px;color:#fff;box-shadow:var(--shadow);min-height:130px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile .ic{font-size:42px;line-height:1}
.tile .lbl{font-size:13px;font-weight:700;opacity:.9;text-transform:uppercase;letter-spacing:.5px}
.tile .nm{font-size:21px;font-weight:800;line-height:1.15}
.tile .st{font-size:15px;font-weight:700;margin-top:6px;background:rgba(255,255,255,.25);border-radius:10px;padding:2px 8px;align-self:flex-start}
.tile.locked{filter:grayscale(.6);opacity:.6;cursor:not-allowed}
.credit{margin-top:34px;text-align:center;font-family:'Cairo',sans-serif;font-weight:700;font-size:18px;color:var(--purple);background:#fff;border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.credit .ph{display:block;direction:ltr;font-family:'Baloo 2',sans-serif;color:var(--pink);font-size:18px}

/* section intro */
.learn{background:#fff;border-radius:20px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:14px;font-size:17px}
.learn b{color:var(--purple)}
.words{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.words span{background:#f1eaff;color:var(--purple);border-radius:10px;padding:2px 10px;font-weight:700;font-size:15px}

/* game shell */
.panel{background:#fff;border-radius:24px;padding:16px;box-shadow:var(--shadow)}
.prog{height:12px;background:#eee8ff;border-radius:10px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--blue),var(--purple));border-radius:10px;transition:width .4s}
.inst{font-size:18px;font-weight:700;color:var(--muted);margin-bottom:10px}
.q{font-size:22px;font-weight:800;margin:4px 0 14px;line-height:1.25}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;border:3px solid #e7e2fb;background:#fbfaff;border-radius:16px;padding:10px 12px;font-size:19px;font-weight:600;color:var(--ink);text-align:left;transition:all .15s}
.opt .L{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--purple);color:#fff;font-weight:800;direction:ltr}
.opt:hover{border-color:#cbbcff}
.opt.ok{border-color:var(--good);background:#e8fbef}.opt.ok .L{background:var(--good)}
.opt.no{border-color:var(--bad);background:#fff0f3;opacity:.6}.opt.no .L{background:var(--bad)}
.opt:disabled{cursor:default}
.next{display:block;margin:16px auto 0;border:0;background:linear-gradient(90deg,var(--purple),var(--pink));color:#fff;font-size:21px;font-weight:800;border-radius:18px;padding:10px 30px;box-shadow:var(--shadow)}
.next:disabled{opacity:.4}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}

/* toast */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;font-size:20px;font-weight:800;padding:10px 22px;border-radius:18px;transition:transform .3s;z-index:50;text-align:center;max-width:92vw}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.good{background:var(--good)}#toast.bad{background:var(--bad)}

/* sort */
.card{margin:6px auto 16px;max-width:420px;background:linear-gradient(135deg,#fff,#f6f1ff);border:3px dashed #cbbcff;border-radius:22px;padding:16px;text-align:center}
.card .e{font-size:58px;line-height:1.1}
.card .tx{font-size:21px;font-weight:800}
.bins{display:grid;gap:10px;font-size:18px}
.bin{border:0;border-radius:18px;padding:10px 6px;color:#fff;font-weight:800;font-size:inherit;overflow-wrap:normal;min-height:86px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--shadow)}
.bin .bi{font-size:30px;line-height:1}
.bin .chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.bin .chips span{background:rgba(255,255,255,.3);border-radius:8px;padding:0 6px;font-size:13px;font-weight:700}

/* order */
.slots{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.slot{display:flex;align-items:center;gap:10px;border:3px dashed #d9d1fb;border-radius:14px;min-height:50px;padding:6px 10px;font-size:18px;font-weight:700;background:#fcfbff}
.slot .n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:800}
.slot.filled{border-style:solid;border-color:var(--purple);background:#f4efff;cursor:pointer}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:0;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font-weight:700;font-size:17px;border-radius:14px;padding:8px 14px;box-shadow:var(--shadow)}
.chip:disabled{opacity:.25}
.ring{position:relative;width:min(340px,86vw);height:min(340px,86vw);margin:14px auto}
.ring svg{position:absolute;inset:0;width:100%;height:100%}
.ring .rb{position:absolute;transform:translate(-50%,-50%);background:#fff;border:3px solid var(--purple);border-radius:14px;padding:4px 8px;font-size:14px;font-weight:800;text-align:center;max-width:120px;line-height:1.1}

/* match */
.mcols{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.mi{border:3px solid #e7e2fb;background:#fbfaff;border-radius:14px;padding:8px 10px;font-size:17px;font-weight:700;color:var(--ink);text-align:left;margin-bottom:8px;width:100%;min-height:48px}
.mi.sel{border-color:var(--orange);background:#fff5e6}
.mi.done{color:#fff;border-color:transparent}

/* selects */
select{font-family:inherit;font-size:17px;font-weight:700;border:3px solid #cbbcff;border-radius:12px;padding:4px 8px;background:#fff;color:var(--ink);max-width:100%}
select.ok{border-color:var(--good);background:#e8fbef}
select.no{border-color:var(--bad);background:#fff0f3}
.lrow{display:flex;align-items:center;gap:10px;margin:6px 0}
.lrow .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-weight:800}
.fill p{font-size:19px;line-height:2.1;margin:6px 0}

/* key */
.keyq{display:flex;align-items:center;gap:8px;border-radius:14px;padding:8px 12px;margin:6px 0;font-size:18px;font-weight:700;background:#f6f3ff;color:#aaa3c8}
.keyq.on{background:#fff5e6;color:var(--ink);border:3px solid var(--orange)}
.keyq.done{background:#e8fbef;color:var(--ink)}
.keyq .yn{margin-left:auto;display:flex;gap:6px}
.keyq .yn button{border:0;border-radius:12px;padding:4px 14px;font-weight:800;font-size:17px;color:#fff}
.yes{background:var(--good)}.no2{background:var(--bad)}
.badge{display:inline-block;background:linear-gradient(90deg,var(--green),var(--blue));color:#fff;border-radius:14px;padding:6px 16px;font-size:20px;font-weight:800}

/* bee game */
.garden{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:linear-gradient(#bde8ff,#d9f7c9);border-radius:20px;padding:10px;position:relative;overflow:hidden}
.garden svg{width:100%;height:auto}
.garden .tgt{cursor:pointer}
#bee{position:absolute;font-size:38px;transition:left .7s ease,top .7s ease;pointer-events:none;z-index:3}
#bee .pd{position:absolute;right:-4px;bottom:2px;width:14px;height:14px;border-radius:50%;border:2px solid #fff;display:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:8px 0;font-weight:700}
.legend i{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:-2px;margin-right:4px}

/* lab */
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{flex:1;border:0;border-radius:14px;padding:8px;font-size:18px;font-weight:800;background:#eee8ff;color:var(--purple)}
.tabs button.on{background:var(--purple);color:#fff}
.days{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.days button{border:0;border-radius:12px;padding:6px 9px;font-weight:800;font-size:17px;background:#fff3d6;color:#b26a00}
.days button.on{background:var(--orange);color:#fff}
.jars{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.jar{text-align:center;font-weight:800}
.jar svg{width:100%;max-width:190px;height:auto}
table.res{width:100%;border-collapse:collapse;margin-top:10px;font-size:17px}
table.res th,table.res td{border:2px solid #e2dbff;padding:6px;text-align:center}
table.res th{background:#f4efff}

/* finish */
.win{text-align:center;padding:20px 8px}
.win .big{font-size:70px;line-height:1}
.win h2{font-size:32px;color:var(--purple)}
.win .stars{font-size:46px;letter-spacing:6px;margin:8px 0}
.confetti{position:fixed;top:-40px;font-size:28px;pointer-events:none;z-index:60;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.chart{width:100%;max-width:520px;display:block;margin:0 auto 8px}
.jumpy{animation:jump .35s ease-out 3}
@keyframes jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
.wob{animation:wob .12s linear 8;transform-origin:center}
@keyframes wob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.btnrow{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.act{border:0;border-radius:16px;padding:10px 14px;font-size:18px;font-weight:800;color:#fff;background:linear-gradient(90deg,var(--blue),var(--purple));box-shadow:var(--shadow);text-align:left}
.act.tried{background:linear-gradient(90deg,var(--good),var(--green))}
.toggle{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.toggle b{width:100%}
.toggle button{border:3px solid #cbbcff;background:#fff;border-radius:14px;padding:6px 16px;font-size:17px;font-weight:800;color:var(--ink)}
.toggle button.on{background:var(--purple);border-color:var(--purple);color:#fff}
canvas.wave{width:100%;height:170px;background:#0f1b3d;border-radius:18px;display:block}
.task{background:#fff5e6;border:3px solid var(--orange);border-radius:16px;padding:10px 12px;font-size:19px;font-weight:800;margin:10px 0}
.neck{background:linear-gradient(#8d5a2b,#6d4321);border-radius:16px;padding:10px 6px;position:relative}
.srow{position:relative;height:42px;cursor:pointer;display:flex;align-items:center}
.srow .str{width:100%;background:linear-gradient(#f5f5f5,#9e9e9e);border-radius:3px}
.srow .str.vib{animation:vib .05s linear 14}
@keyframes vib{0%,100%{transform:translateY(-2px)}50%{transform:translateY(2px)}}
.srow .tg{position:absolute;right:6px;top:2px;font-size:12px;font-weight:800;color:#ffe0b2}
.srow.red .str{background:linear-gradient(#ff8a80,#d32f2f)}
.bottles{display:flex;gap:4px;justify-content:center;align-items:flex-end;background:#f4efff;border-radius:18px;padding:10px 4px}
.bottles svg{width:11%;max-width:62px;cursor:pointer}
.note{background:#fff8e1;border-left:6px solid var(--orange);border-radius:12px;padding:8px 12px;margin:10px 0;font-size:17px}
@media (max-width:480px){
  .hero h1{font-size:32px}.q{font-size:20px}.opt{font-size:17px}.mcols{grid-template-columns:1fr 1.3fr}.mi{font-size:15px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const app = $('#app');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s);
const TRY = ["Try again! 💪", "Not yet – have another go! 🌱", "Almost! Try again 🐝", "Think again, Maaz! 🤔", "Keep going – try again! 🌻"];
const YAY = ["Great job! ⭐", "Brilliant! 🌟", "Well done, Maaz! 🎉", "Super scientist! 🔬", "Correct! 🌻"];
const pick = a => a[Math.floor(Math.random() * a.length)];
let toastT;
function toast(msg, kind) { const t = $('#toast'); t.textContent = msg; t.className = 'show ' + (kind || ''); clearTimeout(toastT); toastT = setTimeout(() => t.className = '', 1600); }
function shake(el) { if (!el) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
function popEl(el) { if (!el) return; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
let actx;
function beep(good) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = good ? [523, 659, 784] : [220, 180];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = good ? 'triangle' : 'sawtooth'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, actx.currentTime + i * .09);
      g.gain.exponentialRampToValueAtTime(good ? .18 : .08, actx.currentTime + i * .09 + .02);
      g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + i * .09 + .18);
      o.connect(g); g.connect(actx.destination); o.start(actx.currentTime + i * .09); o.stop(actx.currentTime + i * .09 + .2);
    });
  } catch (e) {}
}
function confetti() {
  const em = ['🌸', '🌻', '⭐', '🐝', '🌱', '🎉', '🦋', '🌷'];
  for (let i = 0; i < 34; i++) {
    const s = document.createElement('span'); s.className = 'confetti'; s.textContent = pick(em);
    s.style.left = Math.random() * 100 + 'vw'; s.style.animationDuration = (2 + Math.random() * 2) + 's'; s.style.animationDelay = Math.random() * .6 + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 5000);
  }
}
/* stars storage (per browser) */
let STARS = {};
try { STARS = JSON.parse(localStorage.getItem('maazScienceStars') || '{}') || {}; } catch (e) { STARS = {}; }
function saveStar(id, n) { if (!STARS[id] || STARS[id] < n) STARS[id] = n; try { localStorage.setItem('maazScienceStars', JSON.stringify(STARS)); } catch (e) {} }
const starStr = n => '⭐'.repeat(n) + '☆'.repeat(3 - n);

/* bar chart svg */
function barChart(labels, vals, opt) {
  opt = opt || {}; const W = 520, H = 300, L = 46, B = 70, T = 30, R = 10;
  const max = opt.max || Math.max(...vals); const step = opt.step || 1;
  const cw = (W - L - R) / labels.length; const cols = opt.colors || ['#3a86ff', '#ff4d8d', '#ff9f1c', '#2ec4b6', '#7b2ff7'];
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${opt.title || 'bar chart'}">`;
  s += `<text x="${W / 2}" y="18" text-anchor="middle" font-size="17" font-weight="800" fill="#2b2350">${opt.title || ''}</text>`;
  for (let v = 0; v <= max; v += step) { const y = H - B - (v / max) * (H - B - T); s += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="#e7e2fb"/><text x="${L - 6}" y="${y + 5}" text-anchor="end" font-size="13" fill="#6b6490">${v}</text>`; }
  labels.forEach((l, i) => {
    const h = (vals[i] / max) * (H - B - T), x = L + i * cw + cw * .18, w = cw * .64;
    s += `<rect x="${x}" y="${H - B - h}" width="${w}" height="${h}" rx="6" fill="${cols[i % cols.length]}"/>`;
    String(l).split('|').forEach((p, k) => s += `<text x="${x + w / 2}" y="${H - B + 20 + k * 17}" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2350">${p}</text>`);
  });
  s += `<line x1="${L}" x2="${L}" y1="${T - 4}" y2="${H - B}" stroke="#2b2350" stroke-width="2"/><line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="#2b2350" stroke-width="2"/>`;
  if (opt.ylabel) s += `<text x="14" y="${(H - B + T) / 2}" transform="rotate(-90 14 ${(H - B + T) / 2})" text-anchor="middle" font-size="13" font-weight="700" fill="#6b6490">${opt.ylabel}</text>`;
  return s + '</svg>';
}

/* flower diagram for labelling */
const FLOWER_SVG = `
<svg viewBox="0 0 400 380" style="width:100%;max-width:420px;display:block;margin:0 auto" role="img" aria-label="Diagram of a flower cut in half">
  <rect x="192" y="262" width="16" height="118" rx="6" fill="#43a047"/>
  <path d="M200 262 Q150 268 128 236 Q165 236 200 252Z" fill="#2e7d32"/>
  <path d="M200 262 Q250 268 272 236 Q235 236 200 252Z" fill="#2e7d32"/>
  <ellipse cx="118" cy="170" rx="82" ry="34" transform="rotate(-38 118 170)" fill="#ff7eb3"/>
  <ellipse cx="282" cy="170" rx="82" ry="34" transform="rotate(38 282 170)" fill="#ff7eb3"/>
  <ellipse cx="200" cy="150" rx="40" ry="80" fill="#ffb3d1" opacity=".55"/>
  <path d="M100 150 l20 10 M108 175 l18 2" stroke="#c2185b" stroke-width="3" stroke-linecap="round"/>
  <line x1="182" y1="238" x2="146" y2="128" stroke="#f9a825" stroke-width="4"/>
  <line x1="218" y1="238" x2="254" y2="128" stroke="#f9a825" stroke-width="4"/>
  <ellipse cx="144" cy="120" rx="15" ry="9" fill="#ef6c00"/>
  <ellipse cx="256" cy="120" rx="15" ry="9" fill="#ef6c00"/>
  <circle cx="138" cy="108" r="2.5" fill="#ffca28"/><circle cx="150" cy="106" r="2.5" fill="#ffca28"/><circle cx="262" cy="106" r="2.5" fill="#ffca28"/>
  <rect x="195" y="122" width="10" height="92" fill="#9ccc65"/>
  <ellipse cx="200" cy="118" rx="18" ry="9" fill="#7cb342" stroke="#33691e" stroke-width="2"/>
  <ellipse cx="200" cy="238" rx="30" ry="30" fill="#c5e1a5" stroke="#558b2f" stroke-width="3"/>
  <circle cx="190" cy="232" r="5" fill="#fff59d" stroke="#f9a825"/><circle cx="206" cy="228" r="5" fill="#fff59d" stroke="#f9a825"/>
  <circle cx="196" cy="248" r="5" fill="#fff59d" stroke="#f9a825"/><circle cx="210" cy="246" r="5" fill="#fff59d" stroke="#f9a825"/>
  <g stroke="#2b2350" stroke-width="2">
    <line x1="72" y1="190" x2="40" y2="230"/>
    <line x1="150" y1="250" x2="70" y2="320"/>

function playGame(u, s, gi) {
  const g = s.games[gi];
  window.scrollTo(0, 0);
  app.innerHTML = `
  <div class="bar"><button class="back">⬅ Back</button><div class="t">${g.icon} ${g.title}</div></div>
  <div class="panel"><div class="prog"><i style="width:0%"></i></div><div id="gb"></div></div>`;
  app.querySelector('.back').onclick = () => sectionScreen(u, s);
  const ctx = {
    body: $('#gb'), mistakes: 0,
    progress(p) { const i = app.querySelector('.prog i'); if (i) i.style.width = Math.round(p * 100) + '%'; },
    wrong(el, msg) { this.mistakes++; beep(false); shake(el); toast(msg || pick(TRY), 'bad'); },
    right(el, msg) { beep(true); popEl(el); if (msg !== false) toast(msg || pick(YAY), 'good'); },
    finish() {
      if (!document.body.contains(this.body)) return;
      const n = this.mistakes === 0 ? 3 : this.mistakes <= 2 ? 2 : 1;
      saveStar(g.id, n); this.progress(1); confetti(); beep(true);
      const nextG = s.games[gi + 1];
      this.body.innerHTML = `<div class="win"><div class="big">${n === 3 ? '🏆' : n === 2 ? '🌟' : '🌱'}</div>
        <h2>${n === 3 ? 'Perfect, Maaz!' : n === 2 ? 'Great work, Maaz!' : 'You did it, Maaz!'}</h2>
        <div class="stars">${starStr(n)}</div>
        <button class="next" id="again">🔁 Play again</button>
        ${nextG ? `<button class="next" id="nx">Next game ➡ ${nextG.icon}</button>` : `<button class="next" id="nx">Back to topic ✅</button>`}</div>`;
      $('#again').onclick = () => playGame(u, s, gi);
      $('#nx').onclick = () => nextG ? playGame(u, s, gi + 1) : sectionScreen(u, s);
    }
  };
  ({ quiz: runQuiz, sort: runSort, order: runOrder, match: runMatch, label: runLabel, fill: runFill, key: runKey, bee: runBee, lab: runLab, particles: runParticles, thermo: runThermo, dissolve: runDissolve, rice: runRice, wave: runWave, guitar: runGuitar, bottles: runBottles })[g.type](g, ctx);
}

/* ---------- multiple choice (single question renderer) ---------- */
function mcq(container, it, ctx, onDone) {
  if (!container || !document.body.contains(container)) return;
  const idx = it.fixed ? it.o.map((_, i) => i) : shuffle(it.o.map((_, i) => i));
  container.innerHTML = `${it.html || ''}<div class="q">${it.q}</div><div class="opts">${idx.map((k, j) =>
    `<button class="opt" data-k="${k}"><span class="L">${'ABCD'[j]}</span><span>${it.o[k]}</span></button>`).join('')}</div>`;
  container.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (+b.dataset.k === it.a) {
      b.classList.add('ok'); container.querySelectorAll('.opt').forEach(x => x.disabled = true);
      ctx.right(b); setTimeout(onDone, 900);
    } else { b.classList.add('no'); b.disabled = true; ctx.wrong(b); }
  });
}
function runQuiz(g, ctx) {
  const items = g.items; let i = 0;
  const show = () => { ctx.progress(i / items.length); if (i >= items.length) return ctx.finish();
    ctx.body.innerHTML = `<div class="inst">Question ${i + 1} of ${items.length}</div><div id="qq"></div>`;
    mcq($('#qq'), items[i], ctx, () => { i++; show(); }); };
  show();
}

/* ---------- sort ---------- */
function runSort(g, ctx) {
  const items = shuffle(g.items); let i = 0;
  ctx.body.innerHTML = `<div class="inst">${g.inst}</div><div id="sc"></div>
    <div class="bins" style="grid-template-columns:repeat(${g.bins.length > 3 ? 2 : g.bins.length},minmax(0,1fr))${g.bins.length === 3 ? ';font-size:14px' : ''}">${g.bins.map((b, k) =>
      `<button class="bin" style="background:${b.c}${g.bins.length === 5 && k === 4 ? ';grid-column:1/-1' : ''}" data-k="${k}"><span class="bi">${b.i}</span>${b.n}<span class="chips"></span></button>`).join('')}</div>`;
  const card = () => { ctx.progress(i / items.length); if (i >= items.length) return setTimeout(() => ctx.finish(), 700);
    $('#sc').innerHTML = `<div class="card pop"><div class="e">${items[i].e}</div><div class="tx">${items[i].t}</div></div>`; };
  ctx.body.querySelectorAll('.bin').forEach(b => b.onclick = () => {
    if (i >= items.length) return;
    if (+b.dataset.k === items[i].b) {
      const c = document.createElement('span'); c.textContent = items[i].e + ' ' + items[i].t.split(' – ')[0].split(' (')[0];
      b.querySelector('.chips').appendChild(c); ctx.right(b, false); i++; card();
    } else { ctx.wrong(b); shake($('#sc .card')); }
  });
  card();
}

/* ---------- order ---------- */
function runOrder(g, ctx) {
  const N = g.items.length; let pool; do { pool = shuffle(g.items.map((_, k) => k)); } while (pool.every((v, k) => v === k));
  let seq = [];
  const draw = () => {
    ctx.progress(seq.length / N * .9);
    ctx.body.innerHTML = `<div class="inst">${g.inst}</div>
      <div class="slots">${g.items.map((_, k) => seq[k] !== undefined
        ? `<div class="slot filled" data-k="${k}"><span class="n">${k + 1}</span>${g.items[seq[k]]}<span style="margin-left:auto;opacity:.5">✖</span></div>`
        : `<div class="slot"><span class="n">${k + 1}</span><span style="opacity:.4">tap a card below…</span></div>`).join('')}</div>
      <div class="pool">${pool.map(k => `<button class="chip" data-k="${k}" ${seq.includes(k) ? 'disabled' : ''}>${g.items[k]}</button>`).join('')}</div>
      <button class="next" id="chk" ${seq.length < N ? 'disabled' : ''}>✔ Check</button>`;
    ctx.body.querySelectorAll('.chip').forEach(b => b.onclick = () => { seq.push(+b.dataset.k); draw(); });
    ctx.body.querySelectorAll('.slot.filled').forEach(sl => sl.onclick = () => { seq.splice(+sl.dataset.k, 1); draw(); });
    $('#chk').onclick = () => {
      const right = seq.filter((v, k) => v === k).length;
      if (right === N) { ctx.right($('#chk')); done(); }
      else ctx.wrong($('.slots'), `${right} of ${N} are in the right place. Try again! 💪`);
    };
  };
  const done = () => {
    ctx.progress(1);
    let html = `<div class="q" style="text-align:center">✅ Correct order!</div>`;
    if (g.cycle) {
      html += `<div class="ring"><svg viewBox="0 0 100 100"><defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff9f1c"/></marker></defs>`;
      for (let k = 0; k < N; k++) { const a1 = (k / N) * 2 * Math.PI - Math.PI / 2 + .35, a2 = ((k + 1) / N) * 2 * Math.PI - Math.PI / 2 - .35;
        html += `<path d="M${50 + 38 * Math.cos(a1)} ${50 + 38 * Math.sin(a1)} A38 38 0 0 1 ${50 + 38 * Math.cos(a2)} ${50 + 38 * Math.sin(a2)}" fill="none" stroke="#ff9f1c" stroke-width="2.2" marker-end="url(#ah)"/>`; }
      html += `</svg>${g.items.map((t, k) => { const a = (k / N) * 2 * Math.PI - Math.PI / 2; return `<div class="rb" style="left:${50 + 38 * Math.cos(a)}%;top:${50 + 38 * Math.sin(a)}%">${t}</div>`; }).join('')}</div>`;
    } else html += `<div class="slots">${g.items.map((t, k) => `<div class="slot filled" style="cursor:default"><span class="n">${k + 1}</span>${t}</div>`).join('')}</div>`;

function tone(freq, dur, vol, type) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type || 'triangle'; o.frequency.value = freq;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol || .2, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + (dur || .8));
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + (dur || .8) + .05);
  } catch (e) {}
}
function thud() { tone(90, .25, .3, 'square'); tone(140, .2, .15, 'triangle'); }

/* run a list of steps: {tap:i, txt} | {act:'name', txt} | mcq item */
function stepRunner(ctx, steps, taskEl, mcqEl) {
  let k = 0; const api = {};
  const show = () => {
    if (!document.body.contains(taskEl)) return;
    ctx.progress(k / steps.length);
    if (k >= steps.length) { setTimeout(() => ctx.finish(), 600); return; }
    const s = steps[k]; mcqEl.innerHTML = '';
    if (s.q) { taskEl.innerHTML = '🤔 Answer the question below.'; mcq(mcqEl, s, ctx, () => { k++; show(); }); mcqEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
    else taskEl.innerHTML = '🎯 ' + s.txt;
  };
  api.cur = () => steps[k];
  api.tap = (i, el) => { const s = steps[k]; if (!s || s.tap === undefined) return; if (i === s.tap) { ctx.right(el); k++; setTimeout(show, 500); } else ctx.wrong(el, 'Listen again and try again! 👂'); };
  api.act = name => { const s = steps[k]; if (s && s.act === name) { ctx.right(null); k++; setTimeout(show, 500); } };
  show(); return api;
}

    c2.clearRect(0, 0, 640, 200); c2.lineWidth = 5; c2.strokeStyle = '#ffd23f'; c2.beginPath();
    for (let x = 0; x <= 640; x += 4) { const y = 100 + A * Math.sin((x / 640) * cyc * 2 * Math.PI - ph); x ? c2.lineTo(x, y) : c2.moveTo(x, y); }
    c2.stroke(); ph += speed === 'fast' ? .35 : .1; raf = requestAnimationFrame(draw);
  };
  const setTask = () => { ctx.progress(k / tasks.length); $('#tk').innerHTML = `🎯 ${k + 1}/${tasks.length}: ${tasks[k].txt}`; };
  ctx.body.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { size = b.dataset.s; paint(); });
  ctx.body.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { speed = b.dataset.v; paint(); });
  $('#pl').onclick = () => tone(speed === 'fast' ? 880 : 160, 1, size === 'big' ? .35 : .04, 'sine');
  $('#chk').onclick = () => {
    const n = tasks[k].need;
    if ((!n.size || n.size === size) && (!n.speed || n.speed === speed)) {
      ctx.right($('#tk')); tone(speed === 'fast' ? 880 : 160, .7, size === 'big' ? .35 : .04, 'sine'); k++;
      if (k >= tasks.length) setTimeout(() => ctx.finish(), 800); else setTimeout(setTask, 500);
    } else ctx.wrong($('#tk'));
  };
  paint(); setTask(); draw();
}

function runGuitar(g, ctx) {
  const base = [82, 110, 147, 196, 247, 330], th = [8, 6.5, 5, 4, 3, 2]; let tension = 1, tightPluck = false, loosePluck = false;
  ctx.body.innerHTML = `<div class="inst">${g.inst}</div>
    <div class="neck">${base.map((_, i) => `<div class="srow ${i === 2 ? 'red' : ''}" data-i="${i}"><div class="str" style="height:${th[i]}px"></div>${i === 0 ? '<span class="tg">thick string</span>' : i === 5 ? '<span class="tg">thin string</span>' : i === 2 ? '<span class="tg">red string</span>' : ''}</div>`).join('')}</div>
    <div style="display:flex;gap:8px;justify-content:center;margin:10px 0;flex-wrap:wrap"><button class="act" id="tt">🔧 Tighten the red string</button><button class="act" id="ll">🔧 Loosen the red string</button></div>
    <div class="task" id="tk"></div><div id="mq"></div>`;
  const steps = [
    { tap: 5, txt: 'Pluck the thick strings and the thin strings. Then tap the string that makes the HIGHEST-pitched note.' },
    { tap: 0, txt: 'Now tap the string that makes the LOWEST-pitched note.' },
    { q: 'The thicker the string, the … the note.', o: ['lower-pitched', 'higher-pitched'], a: 0, fixed: true },
    { act: 'tight', txt: 'Pluck the red string. Then tap 🔧 Tighten and pluck the red string again.' },
    { q: 'Does the sound have a higher or a lower pitch than before?', o: ['Higher', 'Lower'], a: 0, fixed: true },
    { act: 'loose', txt: 'Now tap 🔧 Loosen two or three times and pluck the red string again.' },
    { q: 'What happened to the pitch when you loosened the string?', o: ['It became lower', 'It became higher'], a: 0, fixed: true },
    { q: 'The more tightly stretched the string, the … the note.', o: ['higher-pitched', 'lower-pitched'], a: 0, fixed: true } ];
  const run = stepRunner(ctx, steps, $('#tk'), $('#mq'));
  ctx.body.querySelectorAll('.srow').forEach(r => r.onclick = () => {
    const i = +r.dataset.i, s = r.querySelector('.str'); s.classList.remove('vib'); void s.offsetWidth; s.classList.add('vib');
    tone(base[i] * (i === 2 ? tension : 1) * 2, 1.1, .3, 'triangle');
    const cur = run.cur();
    if (cur && cur.tap !== undefined) run.tap(i, r);
    if (i === 2 && cur && cur.act === 'tight' && tension > 1) run.act('tight');
    if (i === 2 && cur && cur.act === 'loose' && tension < 1) run.act('loose');
  });
  $('#tt').onclick = () => { tension = Math.min(1.6, tension * 1.12); toast('Tighter! 🔧'); };
  $('#ll').onclick = () => { tension = Math.max(.6, tension / 1.12); toast('Looser! 🔧'); };
}

/* ============ UNIT 3 GAMES ============ */
function particleSim(cv, getMode) {
  const c2 = cv.getContext('2d'), W = cv.width, H = cv.height, R = 11; let ps = [], mode = null, raf;
  const build = m => {
    mode = m; ps = [];
    if (m === 'solid') { for (let r = 0; r < 4; r++) for (let c = 0; c < 7; c++) ps.push({ hx: 60 + c * 24, hy: H - 30 - r * 24 }); }
    if (m === 'liquid') { for (let i = 0; i < 24; i++) ps.push({ x: 40 + Math.random() * (W - 80), y: H - 20 - Math.random() * 95, vx: (Math.random() - .5) * 1.4, vy: (Math.random() - .5) * 1.4 }); }
    if (m === 'gas') { for (let i = 0; i < 9; i++) ps.push({ x: 20 + Math.random() * (W - 40), y: 20 + Math.random() * (H - 40), vx: (Math.random() - .5) * 9, vy: (Math.random() - .5) * 9 }); }
  };
  const frame = () => {
    if (!document.body.contains(cv)) return cancelAnimationFrame(raf);
    const m = getMode(); if (m !== mode) build(m);
    c2.clearRect(0, 0, W, H); c2.fillStyle = '#eef6ff'; c2.fillRect(0, 0, W, H);
    ps.forEach(p => {
      let x, y;
      if (mode === 'solid') { x = p.hx + (Math.random() - .5) * 3; y = p.hy + (Math.random() - .5) * 3; }
      else {
        p.x += p.vx; p.y += p.vy;
        const top = mode === 'liquid' ? H - 125 : R;
        if (p.x < R || p.x > W - R) p.vx *= -1; if (p.y < top || p.y > H - R) p.vy *= -1;
        p.x = Math.max(R, Math.min(W - R, p.x)); p.y = Math.max(top, Math.min(H - R, p.y));
        if (mode === 'liquid') { p.vx += (Math.random() - .5) * .3; p.vy += (Math.random() - .5) * .3; p.vx = Math.max(-1.5, Math.min(1.5, p.vx)); p.vy = Math.max(-1.5, Math.min(1.5, p.vy)); }
        x = p.x; y = p.y;
      }
      c2.beginPath(); c2.arc(x, y, R, 0, 7); c2.fillStyle = '#3a6fd8'; c2.fill(); c2.lineWidth = 2; c2.strokeStyle = '#1b3e8a'; c2.stroke();
    });
    raf = requestAnimationFrame(frame);
  };
  frame();
}
function runParticles(g, ctx) {
  const rounds = shuffle(['solid', 'liquid', 'gas', 'solid', 'liquid', 'gas']); let k = 0;
  ctx.body.innerHTML = `<div class="inst">${g.inst}</div><canvas width="300" height="220" style="width:100%;max-width:420px;display:block;margin:0 auto;border-radius:18px;border:3px solid #cbbcff"></canvas>
    <div class="task" id="tk"></div>
    <div class="bins" style="grid-template-columns:repeat(3,minmax(0,1fr))">
      <button class="bin" data-m="solid" style="background:#7b2ff7"><span class="bi">🧱</span>Solid</button>
      <button class="bin" data-m="liquid" style="background:#3a86ff"><span class="bi">💧</span>Liquid</button>
      <button class="bin" data-m="gas" style="background:#2ec4b6"><span class="bi">🎈</span>Gas</button></div>`;
  particleSim(ctx.body.querySelector('canvas'), () => rounds[Math.min(k, rounds.length - 1)]);
  const setT = () => { ctx.progress(k / rounds.length); $('#tk').textContent = `🎯 ${k + 1}/${rounds.length}: Which state of matter is this?`; };
  ctx.body.querySelectorAll('.bin').forEach(b => b.onclick = () => {
    if (k >= rounds.length) return;
    if (b.dataset.m === rounds[k]) { ctx.right(b); k++; if (k >= rounds.length) setTimeout(() => ctx.finish(), 700); else setT(); }
    else ctx.wrong(b, 'Look at the spaces and the movement. Try again! 🔍');
  });
  setT();
}

function runThermo(g, ctx) {
  let t = 20;
  const tasks = [
    { txt: 'Set the thermometer to the melting point of ice.', v: 0 },
    { txt: 'Set the thermometer to the boiling point of pure water.', v: 100 },
    { txt: 'Set the thermometer to the temperature at which pure water freezes.', v: 0 } ];
  const qs = [
    { q: 'Pure water at –20 °C is…', o: ['solid (ice)', 'liquid (water)', 'gas (steam)'], a: 0, fixed: true },
    { q: 'Pure water at 60 °C is…', o: ['liquid (water)', 'solid (ice)', 'gas (steam)'], a: 0, fixed: true },
    { q: 'What do we use to measure temperature, and what is the unit?', o: ['A thermometer; degrees centigrade (°C)', 'A sound level meter; decibels (dB)', 'A ruler; centimetres (cm)', 'A clock; minutes'], a: 0 } ];
  let k = 0;
  ctx.body.innerHTML = `<div class="inst">${g.inst}</div>
    <div style="display:flex;gap:16px;align-items:center;justify-content:center">
      <svg viewBox="0 0 90 300" style="width:90px;height:300px">
        <rect x="35" y="10" width="20" height="250" rx="10" fill="#fff" stroke="#90a4ae" stroke-width="3"/>
        <circle cx="45" cy="268" r="20" fill="#ef476f" stroke="#90a4ae" stroke-width="3"/>
        <rect id="mer" x="40" y="0" width="10" height="0" fill="#ef476f"/>
        ${[-20, 0, 20, 40, 60, 80, 100, 120].map(v => { const y = 250 - (v + 20) * 1.6; return `<line x1="55" x2="66" y1="${y}" y2="${y}" stroke="#2b2350" stroke-width="2"/><text x="68" y="${y + 4}" font-size="11" font-weight="700" fill="#2b2350">${v}</text>`; }).join('')}
      </svg>
      <div style="text-align:center"><div id="tv" style="font-size:40px;font-weight:800;color:#ef476f"></div><div id="st" style="font-size:54px"></div><div id="sn" style="font-size:20px;font-weight:800"></div></div>
    </div>
    <div style="display:flex;gap:10px;justify-content:center;margin:8px 0"><button class="next" id="dn" style="margin:0">▼ 10 °C</button><button class="next" id="up" style="margin:0">▲ 10 °C</button></div>
    <div class="task" id="tk"></div><button class="next" id="chk">✔ Check</button><div id="mq"></div>`;
  const draw = () => {
    const h = (t + 20) * 1.6; const m = $('#mer'); m.setAttribute('y', 250 - h); m.setAttribute('height', h + 10);
    $('#tv').textContent = t + ' °C';
    const s = t < 0 ? ['🧊', 'Ice – solid'] : t === 0 ? ['🧊💧', 'Melting / freezing'] : t < 100 ? ['💧', 'Water – liquid'] : t === 100 ? ['🫧', 'Boiling'] : ['♨️', 'Steam – gas'];
    $('#st').textContent = s[0]; $('#sn').textContent = s[1];
  };
  $('#up').onclick = () => { if (t < 120) { t += 10; draw(); } };
  $('#dn').onclick = () => { if (t > -20) { t -= 10; draw(); } };
  const setT = () => { ctx.progress(k / (tasks.length + qs.length)); $('#tk').textContent = '🎯 ' + tasks[k].txt; };
  $('#chk').onclick = () => {
    if (t === tasks[k].v) {
      ctx.right($('#tk')); k++;
      if (k < tasks.length) setT();
      else { $('#chk').remove(); $('#tk').textContent = '🤔 Use the thermometer to help you answer.'; let i = 0;
        const nx = () => { ctx.progress((tasks.length + i) / (tasks.length + qs.length)); if (i >= qs.length) return ctx.finish(); mcq($('#mq'), qs[i], ctx, () => { i++; nx(); }); };
        nx(); }
    } else ctx.wrong($('#tk'));
  };
  draw(); setT();
}

function runDissolve(g, ctx) {
  const cv = document.createElement('canvas'); cv.width = 320; cv.height = 220;
  const water = [], salt = []; let stage = 0, from = 0, to = 0, anim = 0;
  for (let r = 0; r < 7; r++) for (let c = 0; c < 11; c++) water.push({ x: 22 + c * 28 + (r % 2) * 10, y: 22 + r * 28 });
  for (let i = 0; i < 16; i++) { const tw = water[Math.floor(Math.random() * water.length)];
    salt.push({ sx: 130 + (i % 4) * 14, sy: 190 - Math.floor(i / 4) * 14, tx: 8 + Math.random() * 304, ty: 8 + Math.random() * 204 }); }
  // spread target evenly on a grid between water particles
  salt.forEach((s, i) => { s.tx = 36 + (i % 4) * 78 + (Math.floor(i / 4) % 2) * 30; s.ty = 36 + Math.floor(i / 4) * 52; });
  ctx.body.innerHTML = `<div class="inst">${g.inst}</div><div id="cvw" style="text-align:center"></div>
    <div class="legend"><span><i style="background:#90caf9"></i>water particles</span><span><i style="background:#fff;border:2px solid #555"></i>salt particles</span></div>
    <button class="next" id="stir">🥄 Stir</button><div id="mq"></div>`;
  cv.style.cssText = 'width:100%;max-width:420px;border-radius:18px;border:3px solid #cbbcff';
  $('#cvw').appendChild(cv); const c2 = cv.getContext('2d');
  const paint = () => {
    if (!document.body.contains(cv)) return;
    if (anim < 1) { anim = Math.min(1, anim + .04); requestAnimationFrame(paint); }
    const p = from + (to - from) * anim;
    c2.fillStyle = '#f5fbff'; c2.fillRect(0, 0, 320, 220);
    water.forEach(w => { c2.beginPath(); c2.arc(w.x, w.y, 9, 0, 7); c2.fillStyle = '#90caf9'; c2.fill(); });
    salt.forEach(s => { c2.beginPath(); c2.arc(s.sx + (s.tx - s.sx) * p, s.sy + (s.ty - s.sy) * p, 7, 0, 7); c2.fillStyle = '#fff'; c2.fill(); c2.lineWidth = 2; c2.strokeStyle = '#555'; c2.stroke(); });
  };
  paint();
  const qs = [
    { q: 'What happened to the salt particles?', o: ['They spread out evenly between the water particles', 'They stayed in a pile at the bottom', 'They turned into water particles', 'They floated away into the air'], a: 0 },
    { q: 'In this solution, which is the solute?', o: ['Salt', 'Water'], a: 0, fixed: true },
    { q: 'Which is the solvent?', o: ['Water', 'Salt'], a: 0, fixed: true },
    { q: 'Why can\'t you see the salt after it has dissolved?', o: ['The salt particles spread evenly in the water, so the solution looks the same throughout', 'The salt was destroyed', 'The salt turned into a gas', 'The salt sank to the bottom'], a: 0 } ];
  $('#stir').onclick = () => {
    if (stage >= 3) return; from = stage / 3; stage++; to = stage / 3; anim = 0; paint(); beep(true); ctx.progress(stage / 3 * .4);
    if (stage === 3) { $('#stir').remove(); let i = 0; const nx = () => { ctx.progress(.4 + i / qs.length * .6); if (i >= qs.length) return ctx.finish(); mcq($('#mq'), qs[i], ctx, () => { i++; nx(); }); $('#mq') && $('#mq').scrollIntoView({ behavior: 'smooth' }); }; setTimeout(nx, 1100); }
    else toast('Keep stirring! 🥄');
  };
}
